# server ブロック内で include する nginx 設定。
# 配信先の document root は、この設定を含む server 側で設定済みである前提。
# security.confの絶対パスは配置先に合わせて変更する。

location = /linux-setup-helper/sw.js {
    include /etc/nginx/snippets/linux-setup-helper-security.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    default_type application/javascript;
}

location = /linux-setup-helper/manifest.webmanifest {
    include /etc/nginx/snippets/linux-setup-helper-security.conf;
    default_type application/manifest+json;
}

location ^~ /linux-setup-helper/ {
    include /etc/nginx/snippets/linux-setup-helper-security.conf;
    try_files $uri $uri/ =404;
}
