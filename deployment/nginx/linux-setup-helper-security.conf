# Linux Setup Helper の各 location 内で include する共通ヘッダー。
# 「always」により、エラー応答にも防御ヘッダーを付与する。
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;

# HTTPSだけで配信することを確認してから有効にする。includeSubDomainsは意図的に省略する。
add_header Strict-Transport-Security "max-age=31536000" always;
